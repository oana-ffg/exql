<!doctype html>
<meta charset="utf-8" />
<title>ExQL social preview</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 44px;
    padding: 0 64px 0 56px;
    color: #f6efe2;
    font-family: Inter, "Segoe UI", sans-serif;
    background: linear-gradient(115deg, #0e1620 0%, #111b26 55%, #0b1118 100%);
  }
  .stage {
    flex: none;
    position: relative;
    width: 540px;
    height: 540px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 50% 42%,
      #24303f 0%,
      #18222e 60%,
      #131b25 100%
    );
    box-shadow: inset 0 0 0 1px #2c3947;
  }
  .stage img {
    position: absolute;
    inset: 22px;
    width: 496px;
    height: 496px;
    filter: drop-shadow(0 18px 26px rgb(0 0 0 / 55%));
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 132px;
    font-weight: 400;
    letter-spacing: -2px;
    line-height: 1;
  }
  h2 {
    margin-top: 8px;
    color: #abe8c6;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 40px;
    font-weight: 400;
  }
  .tabs {
    display: flex;
    gap: 22px;
    margin: 28px 0;
    color: #d8dee6;
    font-size: 21px;
    font-weight: 600;
  }
  .tabs span {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .tabs i {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--color);
  }
  p {
    font-size: 31px;
    line-height: 1.4;
  }
  small {
    display: block;
    margin-top: 24px;
    color: #a3b0c0;
    font-size: 23px;
  }
  small b {
    color: #d8dee6;
    font-weight: 600;
  }
</style>
<div class="stage">
  <img src="social-mascot.png" alt="" />
</div>
<main>
  <h1>ExQL</h1>
  <h2>SQL Server &amp; Azure SQL</h2>
  <div class="tabs">
    <span><i style="--color: #8ed6ae"></i>Dev</span>
    <span><i style="--color: #f6d27a"></i>QA</span>
    <span><i style="--color: #d65a5a"></i>Prod</span>
  </div>
  <p>
    A spreadsheet-style data grid and a SQL editor, in a portable Windows app.
  </p>
  <small><b>No installer.</b> No admin rights. <b>MIT</b> licensed.</small>
</main>
