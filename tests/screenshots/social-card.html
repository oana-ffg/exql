<!doctype html>
<meta charset="utf-8" />
<title>ExQL social preview</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 72px 0 56px;
    color: #f2f5f8;
    font-family: Inter, "Segoe UI", sans-serif;
    background: radial-gradient(
      circle at 25% 50%,
      #1a2533 0%,
      #111822 55%,
      #0d131b 100%
    );
  }
  .badge {
    flex: none;
    display: grid;
    place-items: center;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: #f7f5f1;
    box-shadow:
      0 0 0 1px #33404f,
      0 24px 70px rgb(0 0 0 / 45%);
  }
  .badge img {
    width: 430px;
    height: 430px;
  }
  h1 {
    font-size: 118px;
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 1;
  }
  h2 {
    margin-top: 10px;
    color: #abe8c6;
    font-size: 36px;
    font-weight: 500;
  }
  .tabs {
    display: flex;
    gap: 10px;
    margin: 30px 0;
  }
  .tabs span {
    padding: 7px 16px;
    border: 1px solid #33404f;
    border-top: 4px solid var(--color);
    border-radius: 7px;
    background: #182230;
    font-size: 20px;
    font-weight: 600;
  }
  p {
    font-size: 30px;
    line-height: 1.4;
  }
  small {
    display: block;
    margin-top: 22px;
    color: #a3b0c0;
    font-size: 22px;
    line-height: 1.4;
  }
</style>
<div class="badge">
  <img src="../../public/exql.png" alt="" />
</div>
<main>
  <h1>ExQL</h1>
  <h2>SQL Server &amp; Azure SQL</h2>
  <div class="tabs">
    <span style="--color: #8ed6ae">Dev</span>
    <span style="--color: #f6d27a">QA</span>
    <span style="--color: #bd4545">Prod</span>
  </div>
  <p>
    A spreadsheet-style data grid and a SQL editor, in a portable Windows app.
  </p>
  <small>No installer. No admin rights. MIT licensed.</small>
</main>
